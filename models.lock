# Modèles épinglés, par empreinte sha256.
#
# Format : role|profil|dépôt Hugging Face|fichier|sha256|octets
#
# Pourquoi épingler : un dépôt Hugging Face peut être mis à jour ou republié. Sans
# empreinte, deux installations censées être identiques n'exécutent pas le même
# modèle, et l'index vectoriel produit devient incomparable. Le script
# scripts/fetch-models.sh refuse tout fichier dont l'empreinte diffère.
#
# Profils LLM (choix par RAG_SOURCE_LLM_PROFILE) :
#   small  ~2,1 Go — poste de dev, démo, machine 8 Go
#   medium ~4,7 Go — défaut sur serveur, meilleur compromis qualité/vitesse
#   large  ~9,0 Go — qualité maximale, nécessite 16 Go et de la patience en CPU
#
# Les modèles d'embedding et de reranking sont en Q8_0 : ils sont petits, et une
# quantification agressive dégraderait directement la pertinence de la recherche.

