[project]
name = "rag-source"
version = "0.1.0"
description = "RAG souverain et auto-hébergé : réponses sourcées et citées sur un corpus documentaire local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PTH",          # pathlib plutôt que os.path
]
# Les messages et docstrings sont en français : les apostrophes typographiques sont voulues.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# PyMuPDF n'expose que des annotations partielles : ses appels sont non typés du
# point de vue de mypy. On lève la contrainte pour ce seul module plutôt que
# d'affaiblir le mode strict sur tout le projet.
[[tool.mypy.overrides]]
module = [
    "rag_source.ingest.loaders.pdf",
    "tests.unit.conftest",
    "tests.unit.test_loader_pdf",
    "tests.unit.test_loaders_generic",
]
disable_error_code = ["no-untyped-call", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: nécessite la pile Docker Compose démarrée (lancer avec -m integration)",
]
