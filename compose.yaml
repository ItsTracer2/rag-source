# Pile locale de RAG-Source.
#
#   ./scripts/fetch-models.sh && docker compose up -d
#   puis http://127.0.0.1:8080
#
# Trois serveurs de modèles, une base vectorielle, l'API et l'interface. Les trois serveurs partagent
# la même image llama.cpp avec des arguments différents : un seul runtime à
# connaître, à mettre à jour et à dépanner, et surtout aucun PyTorch — c'est ce qui
# rend l'image de l'API légère et son installation immédiate.
#
# Tous les ports sont publiés sur 127.0.0.1 uniquement : rien n'est exposé au
# réseau local. L'accès distant passe par un tunnel SSH (cf. deploy/scaleway).
#
# Mémoire : les quatre services cohabitent dans la VM de Docker. Sur un poste où
# elle est limitée (Docker Desktop alloue souvent 4 Gio par défaut), le noyau tue
# un conteneur au moment où les trois modèles travaillent ensemble. D'où des
# contextes dimensionnés au besoin réel plutôt qu'au maximum possible ; augmenter
# la mémoire de Docker ou exécuter le LLM nativement (compose.native-llm.yaml)
# lève la contrainte.
#
# Les contextes d'embedding et de reranking sont volontairement courts (2048) :
# llama.cpp réserve la mémoire du contexte multipliée par le nombre de créneaux
# parallèles. Avec 8192 et 4 créneaux, le conteneur se faisait tuer par manque de
# mémoire au milieu d'une indexation. Les chunks font au plus 700 tokens : 2048
# laisse une marge confortable.

name: rag-source

x-llama: &llama
  image: ghcr.io/ggml-org/llama.cpp:server
  restart: unless-stopped
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 120s

services:
  # ── Génération ──────────────────────────────────────────────────────────────
  llm:
    <<: *llama
    command: >
      --model /models/${RAG_SOURCE_LLM_FILE:-qwen2.5-3b-instruct-q4_k_m.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${RAG_SOURCE_LLM_CONTEXT_SIZE:-4096}
      --parallel ${RAG_SOURCE_LLM_PARALLEL:-1}
      --threads ${RAG_SOURCE_LLM_THREADS:-4}
      --no-warmup
    ports:
      - "127.0.0.1:8081:8080"

  # ── Embedding (bge-m3) ──────────────────────────────────────────────────────
  embed:
    <<: *llama
    command: >
      --model /models/bge-m3-Q8_0.gguf
      --host 0.0.0.0 --port 8080
      --embeddings
      --pooling cls
      --parallel 1
      --ctx-size ${RAG_SOURCE_EMBED_CTX:-2048}
      --batch-size ${RAG_SOURCE_EMBED_CTX:-2048}
      --ubatch-size ${RAG_SOURCE_EMBED_CTX:-2048}
      --threads ${RAG_SOURCE_EMBED_THREADS:-4}
    ports:
      - "127.0.0.1:8082:8080"

  # ── Reranking (bge-reranker-v2-m3) ──────────────────────────────────────────
  rerank:
    <<: *llama
    command: >
      --model /models/bge-reranker-v2-m3-Q8_0.gguf
      --host 0.0.0.0 --port 8080
      --reranking
      --parallel 1
      --ctx-size ${RAG_SOURCE_RERANK_CTX:-2048}
      --batch-size ${RAG_SOURCE_RERANK_CTX:-2048}
      --ubatch-size ${RAG_SOURCE_RERANK_CTX:-2048}
      --threads ${RAG_SOURCE_RERANK_THREADS:-4}
    ports:
      - "127.0.0.1:8083:8080"

  # ── Base vectorielle ────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    environment:
      # Une clé vide n'est pas « pas d'authentification » : Qdrant refuserait alors
      # toute écriture. On exige donc une vraie valeur, générée par init-env.sh.
      QDRANT__SERVICE__API_KEY: ${RAG_SOURCE_QDRANT_API_KEY:?lancer ./scripts/init-env.sh}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      # L'image Qdrant ne contient ni curl ni wget : on interroge le port avec
      # l'outil de vérification fourni par Qdrant lui-même.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── API RAG-Source ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      # Depuis un conteneur, les services se joignent par leur nom : les valeurs du
      # .env décrivent le point de vue de la machine hôte et ne conviennent pas ici.
      RAG_SOURCE_EMBED_URL: http://embed:8080
      RAG_SOURCE_RERANK_URL: http://rerank:8080
      RAG_SOURCE_LLM_BASE_URL: ${RAG_SOURCE_API_LLM_URL:-http://host.docker.internal:8081/v1}
      RAG_SOURCE_QDRANT_URL: http://qdrant:6333
      RAG_SOURCE_QDRANT_API_KEY: ${RAG_SOURCE_QDRANT_API_KEY:?lancer ./scripts/init-env.sh}
      RAG_SOURCE_API_TOKEN: ${RAG_SOURCE_API_TOKEN:?lancer ./scripts/init-env.sh}
      RAG_SOURCE_QDRANT_COLLECTION: ${RAG_SOURCE_QDRANT_COLLECTION:-rag_source}
      RAG_SOURCE_MODELS_DIR: /models
      RAG_SOURCE_DATA_DIR: /data
    volumes:
      - ./models:/models:ro
      - ./data:/data:ro
    extra_hosts:
      # Permet de viser un llama-server lancé nativement sur l'hôte (macOS, Metal).
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      embed:
        condition: service_healthy
      rerank:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # ── Interface web ───────────────────────────────────────────────────────────
  ui:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Caddy porte le jeton : la page n'a aucun secret à stocker.
      RAG_SOURCE_API_TOKEN: ${RAG_SOURCE_API_TOKEN:?lancer ./scripts/init-env.sh}
      RAG_SOURCE_API_URL: http://api:8000
    volumes:
      - ./ui/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ui:/srv:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  qdrant-storage:
